- hosts: all
  become: true

  vars:
    tomcat_version: "9.0.122"
    project_dir: "/opt/netflix"
    tomcat_dir: "/root/tomcat"

  tasks:

    - name: Install Java Git Maven
      apt:
        name:
          - openjdk-17-jdk
          - git
          - maven
        state: present
        update_cache: yes

    - name: Download Tomcat
      get_url:
        url: "https://dlcdn.apache.org/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/root/apache-tomcat-{{ tomcat_version }}.tar.gz"

    - name: Extract Tomcat
      unarchive:
        src: "/root/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/root/"
        remote_src: yes

    - name: Remove old Tomcat
      file:
        path: "{{ tomcat_dir }}"
        state: absent

    - name: Rename Tomcat
      command:
        cmd: "mv /root/apache-tomcat-{{ tomcat_version }} {{ tomcat_dir }}"

    - name: Configure Tomcat users
      template:
        src: tomcat-users.xml
        dest: "{{ tomcat_dir }}/conf/tomcat-users.xml"

    - name: Configure Manager
      template:
        src: context.xml
        dest: "{{ tomcat_dir }}/webapps/manager/META-INF/context.xml"

    - name: Remove old project
      file:
        path: "{{ project_dir }}"
        state: absent

    - name: Clone Netflix project
      git:
        repo: "https://github.com/Iamnishantraj/jenkins-java-project.git"
        dest: "{{ project_dir }}"
        version: master

    - name: Build WAR using Maven
      command: mvn clean package
      args:
        chdir: "{{ project_dir }}"

    - name: Verify WAR
      stat:
        path: "{{ project_dir }}/target/NETFLIX-1.2.2.war"
      register: war_file

    - name: Stop Tomcat
      shell: "{{ tomcat_dir }}/bin/shutdown.sh"
      ignore_errors: yes

    - name: Remove old Netflix deployment
      file:
        path: "{{ tomcat_dir }}/webapps/netflix"
        state: absent

    - name: Remove old Netflix WAR
      file:
        path: "{{ tomcat_dir }}/webapps/netflix.war"
        state: absent

    - name: Deploy WAR as netflix
      copy:
        src: "{{ project_dir }}/target/NETFLIX-1.2.2.war"
        dest: "{{ tomcat_dir }}/webapps/netflix.war"
        remote_src: yes
      when: war_file.stat.exists

    - name: Start Tomcat
      shell: "{{ tomcat_dir }}/bin/startup.sh"

    - name: Wait for Tomcat
      pause:
        seconds: 10

    - name: Check deployed application
      shell: "ls -ld {{ tomcat_dir }}/webapps/netflix"
      register: app_status
      changed_when: false

    - name: Show deployment result
      debug:
        msg: "{{ app_status.stdout }}"
...
